# Run the AI SaaS Factory as a standalone server (dashboard + REST + webhook)
# plus, optionally, scale-out queue workers. Linux host recommended.
#
#   docker compose up -d --build          # start the server on :7788
#   docker compose run --rm factory new "an idea" --stack fastapi-postgres-api --yes
#   docker compose --profile workers up -d # add a background worker
#
# AUTH — provide ONE of:
#   1) export GITHUB_TOKEN=...  (a token carrying the 'copilot' scope), or
#   2) mount your existing gh login (the ${HOME}/.config/gh bind below).
#      Create it once on the host:  gh auth login && gh auth refresh --scopes copilot
#
# DOCKER — the factory drives Docker for verify/deploy/ZAP. This compose file uses
# the SOCKET-MOUNT model: generated app containers are siblings of the factory on
# the host daemon. `network_mode: host` makes the verify probe's localhost:8000/:3000
# reach them, and the identical /var/lib/factory bind keeps build-context paths in
# sync between the container and the host daemon. (See the dind alternative at the end.)

services:
  factory:
    build: .
    image: ai-saas-factory:latest
    # Host networking so verify/health probes (localhost:PORT) reach sibling app
    # containers built through the mounted daemon. Linux only; on Docker Desktop
    # use the dind profile instead.
    network_mode: host
    environment:
      FACTORY_WEB_HOST: 0.0.0.0
      FACTORY_WEB_PORT: "7788"
      FACTORY_DATA_DIR: /var/lib/factory/.factory
      FACTORY_WORKSPACES_DIR: /var/lib/factory/workspaces
      # Auth option 1: a token with the 'copilot' scope (leave empty to use the mounted gh login).
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # Where pushes go (only used when not offline).
      FACTORY_GITHUB_OWNER: ${FACTORY_GITHUB_OWNER:-}
      FACTORY_REPO_VISIBILITY: ${FACTORY_REPO_VISIBILITY:-private}
      # Set true to skip all GitHub push (Copilot-only runs).
      FACTORY_OFFLINE: ${FACTORY_OFFLINE:-false}
      # Keep cloud deploy off unless you also mount cloud creds (azd/aws).
      FACTORY_DEPLOY: ${FACTORY_DEPLOY:-false}
      FACTORY_CLOUD: ${FACTORY_CLOUD:-none}
    volumes:
      # Run Docker (verify/delivery/Trivy/ZAP) via the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # IDENTICAL host<->container path so the daemon can read each build context.
      - /var/lib/factory:/var/lib/factory
      # Auth option 2: reuse your host gh + copilot login (read-only).
      - ${HOME}/.config/gh:/root/.config/gh:ro
    restart: unless-stopped

  # Optional: background worker(s) that drain the job queue. Scale with --scale.
  worker:
    build: .
    image: ai-saas-factory:latest
    profiles: ["workers"]
    command: ["worker"]
    network_mode: host
    environment:
      FACTORY_DATA_DIR: /var/lib/factory/.factory
      FACTORY_WORKSPACES_DIR: /var/lib/factory/workspaces
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      FACTORY_OFFLINE: ${FACTORY_OFFLINE:-false}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/factory:/var/lib/factory
      - ${HOME}/.config/gh:/root/.config/gh:ro
    restart: unless-stopped

# ---------------------------------------------------------------------------
# ALTERNATIVE: Docker-in-Docker (stronger isolation; works off Docker Desktop).
# Trade-off: generated apps run on the dind network, so the verify health probe's
# `localhost:PORT` will NOT reach them without making the probe host configurable.
# Prefer the socket-mount model above unless you need full isolation.
#
#   services:
#     dind:
#       image: docker:dind
